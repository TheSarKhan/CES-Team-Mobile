name: Android APK CI and deploy
# APK yığımı ~12-18 dəqiqə çəkir və veb deploy üçün lazım deyil, ona görə hər push-da işləmir:
#   • yeni APK üçün:  git tag v1.0.X && git push origin v1.0.X   (və ya GitHub → Actions → «Run workflow»)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ces-team-android-production
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.CES_TEAM_ANDROID_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.CES_TEAM_ANDROID_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 -d > android/app/ces-team-release.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          marker = '    signingConfigs {\n'
          assert s.count(marker) == 1
          s = s.replace(marker, marker + '''        release {\n            storeFile file('ces-team-release.jks')\n            storePassword System.getenv('KEY_PASSWORD')\n            keyAlias 'ces-team'\n            keyPassword System.getenv('KEY_PASSWORD')\n        }\n''')
          start = s.index('        release {', s.index('    buildTypes {'))
          index = s.index('signingConfig signingConfigs.debug', start)
          s = s[:index] + s[index:].replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release', 1)
          p.write_text(s)
          PY
      - name: Build APK
        env:
          KEY_PASSWORD: ${{ secrets.CES_TEAM_ANDROID_PASSWORD }}
          EXPO_PUBLIC_API_BASE_URL: https://team.cesgroup.az
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: ces-team-apk
          path: android/app/build/outputs/apk/release/app-release.apk
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ces-team-apk
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CES_TEAM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CES_TEAM_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Publish APK
        env:
          DEPLOY_HOST: ${{ secrets.CES_TEAM_HOST }}
          DEPLOY_USER: ${{ secrets.CES_TEAM_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          scp app-release.apk "$DEPLOY_USER@$DEPLOY_HOST:/var/www/team-downloads/ces-team-$SHA.apk"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "test -s /var/www/team-downloads/ces-team-$SHA.apk && mv /var/www/team-downloads/ces-team-$SHA.apk /var/www/team-downloads/ces-team.apk"
